spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/blinkit}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      fail-on-empty-beans: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-change-this-secret-key}
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.blinkit: DEBUG
